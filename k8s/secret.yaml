apiVersion: v1
kind: Secret
metadata:
  name: vtthought-secrets
  namespace: vtthought
  labels:
    app.kubernetes.io/name: vtthought
type: Opaque
stringData:
  # JWT secret for token signing (generate with: openssl rand -hex 32)
  JWT_SECRET: "CHANGE_ME_generate_with_openssl_rand_hex_32"

  # Google OAuth (ADR-002) - optional, for multi-user mode
  # Get from: https://console.cloud.google.com/apis/credentials
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # Cloudflare Tunnel token (ADR-009) - optional
  # Get from: https://one.dash.cloudflare.com/
  CLOUDFLARE_TUNNEL_TOKEN: ""
