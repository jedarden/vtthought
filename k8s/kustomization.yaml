apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vtthought

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  # Uncomment if using ingress
  # - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: vtthought
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/jedarden/vtthought
    newTag: latest-cpu
