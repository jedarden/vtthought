apiVersion: v1
kind: Service
metadata:
  name: vtthought-backend
  namespace: vtthought
  labels:
    app.kubernetes.io/name: vtthought
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: vtthought
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: vtthought
  labels:
    app.kubernetes.io/name: vtthought
    app.kubernetes.io/component: ollama
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: vtthought
    app.kubernetes.io/component: ollama
