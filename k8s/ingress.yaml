apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vtthought-ingress
  namespace: vtthought
  labels:
    app.kubernetes.io/name: vtthought
  annotations:
    # For Traefik (k3s default)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Enable WebSocket support
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    # For nginx-ingress (if using)
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # nginx.ingress.kubernetes.io/websocket-services: "vtthought-backend"
spec:
  # Uncomment and configure for your domain
  # tls:
  #   - hosts:
  #       - vtthought.example.com
  #     secretName: vtthought-tls
  rules:
    - host: vtthought.local  # Change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vtthought-backend
                port:
                  number: 8000
