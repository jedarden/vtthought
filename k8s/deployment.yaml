apiVersion: apps/v1
kind: Deployment
metadata:
  name: vtthought-backend
  namespace: vtthought
  labels:
    app.kubernetes.io/name: vtthought
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vtthought
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vtthought
        app.kubernetes.io/component: backend
      annotations:
        # Force restart on config changes
        checksum/config: "PLACEHOLDER_WILL_BE_UPDATED"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: backend
          # Use CPU image for k3s without GPU
          # For GPU: ghcr.io/jedarden/vtthought:latest-gpu
          image: ghcr.io/jedarden/vtthought:latest-cpu
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: vtthought-config
            - secretRef:
                name: vtthought-secrets

          volumeMounts:
            - name: data
              mountPath: /data
            - name: models
              mountPath: /home/vtthought/.cache/whisper

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
              # For GPU nodes, uncomment:
              # nvidia.com/gpu: "1"

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30  # Allow 5 minutes for model download

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vtthought-data
        - name: models
          persistentVolumeClaim:
            claimName: vtthought-models

      # Tolerate k3s control-plane nodes if needed
      # tolerations:
      #   - key: "node-role.kubernetes.io/control-plane"
      #     operator: "Exists"
      #     effect: "NoSchedule"
---
# Ollama Deployment (optional - for local LLM)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: vtthought
  labels:
    app.kubernetes.io/name: vtthought
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vtthought
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vtthought
        app.kubernetes.io/component: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP

          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
              # For GPU nodes:
              # nvidia.com/gpu: "1"

          # Pull model on startup
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 10 && ollama pull llama3.1:8b || true"

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: vtthought
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi  # LLM models are large
